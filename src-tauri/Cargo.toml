[package]
name = "fallout-lore-archive"
version = "0.1.0"
description = "A local, evidence-aware Fallout lore explorer"
authors = ["Fallout Lore Archive contributors"]
edition = "2021"

[lib]
name = "fallout_lore_archive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

